# This is used in development only (Alchemy is used for production deployments).
# dweb-people-mini-app and people are replaced with real values by `pnpm new-app`.

name = "dweb-people-mini-app-dev"
main = "server/src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "dweb-people-mini-app-dev-db"
database_id = "local"

# Durable Object binding
[[durable_objects.bindings]]
name = "DURABLE_OBJECT"
class_name = "Broadcaster"
script_name = "dweb-people-mini-app-dev"

# Durable Object migration
[[migrations]]
tag = "v1"
new_classes = ["Broadcaster"]

# Static assets (client build). In dev you normally browse through Vite, but the
# Worker needs the ASSETS binding for non-API paths (predev builds client/dist).
# Production uses the equivalent config in alchemy.run.ts.
[assets]
directory = "./client/dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "single-page-application"
run_worker_first = true

# Secrets required by the Worker (uncomment when you add your first secret).
# In local dev, wrangler dev loads ONLY these keys from `.env` into c.env,
# keeping deploy creds (ALCHEMY_STATE_TOKEN etc.) out of the app runtime.
# Missing keys log a warning; dev stays runnable. NEVER create a .dev.vars
# file — its presence makes wrangler dev ignore .env entirely.
# [secrets]
# required = ["MY_SECRET"]

# ALLOWED_PRODUCTION_ORIGIN is the prod origin only — set it in alchemy.run.ts, and
# leave it unset here so the JWT audience check is skipped in dev. Each scaffolded app
# gets its own port pair (5174/8788, 5175/8789, …), which a hardcoded localhost value
# wouldn't match. Uncomment below only to pin the check to one local port on purpose.
[vars]
# ALLOWED_PRODUCTION_ORIGIN = "http://localhost:5173"

# Dev server configuration
[dev]
port = 8788